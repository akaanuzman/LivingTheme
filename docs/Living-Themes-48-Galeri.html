  var TAU = Math.PI * 2;

  var clamp = (n, a = 0, b = 1) => Math.max(a, Math.min(b, n));
  var mix = (a, b, t) => {
    const c = (s, i) => parseInt(s.slice(i, i + 2), 16);
    return "#" + [1, 3, 5].map((i) => Math.round(c(a, i) * (1 - t) + c(b, i) * t).toString(16).padStart(2, "0")).join("");
  };
  function paintWorld(ctx, w, h, id, time, intensity = 0.65) {
    const theme2 = THEMES.find((t2) => t2.id === id) ?? THEMES[0];
    const p = theme2.palette, t = time * (0.3 + clamp(intensity) * 0.9), scale = clamp(Math.min(w / 1150, h / 640), 0.55, 1.65);

    function mask(cx, cy, rx, ry, field, color = p.accent, angle = 0, alpha = 1) {

    }
    function stars(count = 85) {

      }
    }
    function grid2() {

    function water() {

      mask(cx, cy, size * pulse, size * 0.8, (x, y) => {
        if (y > 0.1 || y < -1) return 0;

        const x = cx + (k - 3) * size * 0.2 + Math.sin(y * 0.03 + t * 1.2 + k + phase) * size * 0.12;

        for (let car = 0; car < 4; car++) {
          const x = w * (0.12 + car * 0.23), bw = w * 0.19, bh = 58 * scale;
          mask(x, y, bw * 0.5, bh * 0.5, (u, v) => Math.abs(u) < 1 && Math.abs(v) < 1 ? 0.6 : 0, p.secondary);
          for (let i = 0; i < 4; i++) mask(x + bw * (-0.32 + i * 0.22), y - bh * 0.08, bw * 0.065, bh * 0.15, (u, v) => Math.abs(u) < 1 && Math.abs(v) < 1 ? 0.85 : 0, p.glow);
          for (const side of [-1, 1]) {
            const xx = x + side * bw * 0.32, yy = y + bh * 0.55;
            mask(xx, yy, 12 * scale, 12 * scale, (u, v) => u * u + v * v < 1 ? 0.55 : 0, p.muted);
            char(xx + Math.cos(t * 1.4) * 8 * scale, yy + Math.sin(t * 1.4) * 8 * scale, "+", p.accent);
          }
        }
        for (let x = 0; x < w; x += stepX) {
          char(x, y + 48 * scale, "=", p.muted, 0.75);
          if (fract(x * 0.02 + t * 0.4) < 0.3) char(x, y + 60 * scale, "#", p.muted, 0.6);
        }
        break;
      }
      case "black-hole": {
        stars(120);
        const x = w * 0.68, y = h * 0.46, s = 125 * scale;
        for (let band = 0; band < 7; band++) for (let k = 0; k < 130; k++) {
          const a = k * TAU / 130 + t * (0.08 + band * 0.012), r = s * (1.05 + band * 0.1), xx = Math.cos(a) * r, yy = Math.sin(a) * r * 0.32;
          char(x + xx, y + yy + xx * 0.18, k % 3 ? ":" : "*", band % 2 ? p.accent : p.secondary, 0.4 + Math.sin(a) * 0.2);
        }
        mask(x, y, s * 0.72, s * 0.72, (u, v) => Math.abs(u * u + v * v - 1) < 0.16 ? 0.9 : 0, p.glow);
        ctx.globalAlpha = 1;
        ctx.fillStyle = p.bg;
        for (let yy = -s * 0.61; yy < s * 0.61; yy += stepY * 0.5) {
          const half = Math.sqrt(Math.max(0, (s * 0.61) ** 2 - yy * yy));
          ctx.fillRect(x - half, y + yy, half * 2, stepY * 0.5);
        }
        for (let i = 0; i < 22; i++) {
          const a = t * 0.2 + i * 0.4, r = s * (1.9 - fract(t * 0.03 + i * 0.17) * 0.9);
          char(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.7, ".", p.secondary, 0.55);
        }
        break;
      }
      case "orbital-station": {
        stars(150);
        const x = w * 0.66, y = h * 0.46, s = 100 * scale, a = t * 0.075;
        mask(w * 0.1, h * 1.1, w * 0.6, h * 0.42, (u, v) => Math.abs(u * u + v * v - 1) < 0.09 ? 0.65 : 0, p.secondary);
        for (let k = 0; k < 120; k++) {
          const aa = k * TAU / 120;
          char(x + Math.cos(aa) * s, y + Math.sin(aa) * s * 0.55, k % 8 ? "=" : "#", p.accent, 0.8);
        }
        for (const side of [-1, 1]) {
          const xx = x + Math.cos(a) * s * side, yy = y + Math.sin(a) * s * 0.55 * side;
          mask(xx, yy, s * 0.57, s * 0.25, (u, v) => Math.abs(u) < 1 && Math.abs(v) < 1 ? 0.4 + (Math.abs(Math.sin(u * 13) * Math.cos(v * 7)) < 0.25 ? 0.4 : 0) : 0, p.secondary, a);
          for (let k = 0; k < 18; k++) char(x + (xx - x) * k / 17, y + (yy - y) * k / 17, "+", p.muted, 0.8);
        }
        mask(x, y, s * 0.25, s * 0.25, (u, v) => u * u + v * v < 1 ? 0.8 : 0, p.glow);
        break;
      }
      case "rocket-launch": {
        stars(95);
        const x = w * 0.66 + Math.sin(t * 0.13) * 20 * scale, y = h * (0.4 + 0.04 * Math.sin(t * 0.16)), s = 80 * scale;
        mask(x, y, s * 0.4, s, (u, v) => v > -1 && v < 0.8 && Math.abs(u) < Math.min(0.9, (v + 1) * 1.4) ? 0.7 : 0, p.secondary);
        mask(x, y - s * 0.12, s * 0.16, s * 0.16, (u, v) => u * u + v * v < 1 ? 0.9 : 0, p.glow);
        for (const side of [-1, 1]) mask(x + side * s * 0.4, y + s * 0.6, s * 0.3, s * 0.45, (u, v) => v > -0.7 && v < 0.8 && Math.abs(u) < (v + 1) * 0.5 ? 0.65 : 0, p.accent);
        for (let k = 0; k < 22; k++) {
          const q = k / 21, flame = (1 - q) * s * 0.25;
          for (let xx = -flame; xx <= flame; xx += stepX) char(x + xx, y + s * 0.8 + q * s * 1.3, Math.sin(t * 4 + k) > 0 ? "%" : ":", q < 0.3 ? p.glow : p.accent, 1 - q * 0.65);
        }
        for (let i = 0; i < 5; i++) cloud(x + Math.sin(i * 2) * s * 0.9, h * 0.95 - i * 7 * scale, 55 * scale + i * 9 * scale, p.muted, 0.45);
        for (let i = 0; i < 40; i++) char(rnd(i + 4) * w, wrap(rnd(i + 7) * h + t * 35, h), ".", p.glow, 0.35);
        break;
      }
      case "alien-orchard": {
        stars(70);
        mask(w * 0.78, h * 0.16, 35 * scale, 35 * scale, (u, v) => u * u + v * v < 1 ? 0.7 : 0, p.secondary);
        mask(w * 0.9, h * 0.23, 20 * scale, 20 * scale, (u, v) => u * u + v * v < 1 ? 0.7 : 0, p.accent);
        for (let i = 0; i < 9; i++) {
          const x = (i + 0.3) * w / 9, y = h * 0.88, hh = (90 + rnd(i + 12) * 100) * scale, sway = Math.sin(t * 0.25 + i) * 15 * scale;
          for (let k = 0; k < hh; k += stepY) char(x + sway * k / hh, y - k, "|", p.muted, 0.85);
          for (let branch = 0; branch < 3; branch++) {
            const xx = x + sway + Math.sin(branch * 2 + i) * hh * 0.3, yy = y - hh + branch * 18 * scale;
            mask(xx, yy, hh * 0.27, hh * 0.17, (u, v) => u * u + v * v < 1 ? 0.4 + 0.35 * Math.sin(t * 0.35 + i) ** 2 : 0, branch % 2 ? p.secondary : p.accent);
            char(xx, yy, "@", p.glow, 0.8);
            glow(xx, yy, hh * 0.3, p.accent, 0.12);
          }
        }
        for (let i = 0; i < 35; i++) char(wrap(rnd(i + 3) * w + t * 3, w), h * (0.5 + rnd(i + 17) * 0.4) + Math.sin(t * 0.3 + i) * 15, ".", p.glow, 0.4);
        break;
      }
      case "retro-arcade": {
        stars(50);
        const invader = ["  #   #  ", "   # #   ", "  #####  ", " ## # ## ", "#########", "# ##### #", "# #   # #", "   # #   "];
        for (let fleet = 0; fleet < 2; fleet++) for (let i = 0; i < 5; i++) {
          const x2 = w * (0.12 + i * 0.18) + Math.sin(t * 0.35) * 30 * scale, y2 = h * (0.18 + fleet * 0.22), cell = stepX * 1.4;
          for (let row = 0; row < invader.length; row++) for (let col = 0; col < 9; col++) if (invader[row][col] === "#" && !(row === 7 && Math.sin(t * 2) > 0 && col === 3)) char(x2 + (col - 4) * cell, y2 + row * stepY, "#", fleet ? p.secondary : p.accent);
        }
        const x = w * (0.5 + 0.3 * Math.sin(t * 0.2)), y = h * 0.86;
        mask(x, y, 28 * scale, 22 * scale, (u, v) => Math.abs(u) < 0.8 - Math.abs(v) * 0.5 ? 0.8 : 0, p.glow);
        for (let i = 0; i < 4; i++) {
          const yy = y - fract(t * 0.6 + i * 0.25) * h * 0.75;
          char(x, yy, "|", p.glow, 0.8);
        }
        break;
      }
      case "hologram-city": {
        for (let tower = 0; tower < 11; tower++) {
          const x = (tower + 0.2) * w / 11, bw = 45 * scale, bh = (70 + rnd(tower + 8) * 200) * scale, base = h * (0.85 + 0.03 * Math.sin(t * 0.3 + tower));
          for (let yy = base - bh; yy <= base; yy += stepY) for (let xx = x; xx < x + bw; xx += stepX) {
            const edge = xx === x || xx > x + bw - stepX || yy < base - bh + stepY || yy > base - stepY, scan = fract((yy - base) / bh + t * 0.15);
            if (edge || scan < 0.1 || rnd(xx + yy) > 0.83) char(xx, yy, edge ? "+" : scan < 0.1 ? "=" : ":", edge ? p.accent : p.secondary, edge ? 0.75 : 0.35);
          }
          if (tower < 10) for (let k = 0; k < 12; k++) {
            const q = k / 11;
            char(x + bw + q * w * 0.06, base - bh * 0.4, "-", p.muted, 0.5);
            if (fract(t * 0.35 + tower * 0.12 + q) < 0.12) char(x + bw + q * w * 0.06, base - bh * 0.4, "*", p.glow);
          }
        }
        for (let i = 0; i < 50; i++) char(rnd(i + 33) * w, wrap(rnd(i + 19) * h - t * 9, h), "0", p.secondary, 0.15);
        break;
      }
    }
    ctx.globalAlpha = 1;
  }

  // shared/descriptions.en.ts
  var descriptions = {

  // preview-entry.js
  var language = "en";
  var grid = document.querySelector("#grid");
  var cards = [];
  var frozen = false;
  var elapsed = 0;
  var last = performance.now();
  var observer = new IntersectionObserver((entries) => {
    for (const e of entries) e.target.visible = e.isIntersecting;
  }, { rootMargin: "100px" });
  for (const theme2 of THEMES) {
    const card = document.createElement("article"), canvas = document.createElement("canvas"), label = document.createElement("h2"), description = document.createElement("p");
    card.dataset.search = (theme2.name + " " + theme2.group + " " + theme2.description).toLocaleLowerCase(language);
    label.textContent = theme2.name;
    description.textContent = language === "tr" ? theme2.description : descriptions[theme2.id];
    card.dataset.search = (theme2.name + " " + description.textContent).toLocaleLowerCase(language);
    card.append(canvas, label, description);
    grid.append(card);
    observer.observe(card);
    cards.push({ card, canvas, theme: theme2 });
  }
  document.querySelector("#filter").addEventListener("input", (event) => {
    const q = event.target.value.toLocaleLowerCase(language);
    for (const { card } of cards) card.hidden = !card.dataset.search.includes(q);
  });
  document.querySelector("#pause").addEventListener("click", (event) => {
    frozen = !frozen;
    event.target.textContent = frozen ? language === "tr" ? "Devam et" : "Resume" : language === "tr" ? "Duraklat" : "Pause";
  });
  setInterval(() => {
    const now = performance.now();
    if (!frozen && !document.hidden) elapsed += now - last;
    last = now;
    for (const { card, canvas, theme: theme2 } of cards) {
      if (card.hidden || !card.visible) continue;
      const width = canvas.clientWidth, height = canvas.clientHeight, dpr = Math.min(devicePixelRatio, 2);
      if (canvas.width !== Math.round(width * dpr) || canvas.height !== Math.round(height * dpr)) {
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
      }
      const ctx = canvas.getContext("2d");
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      paintWorld(ctx, width, height, theme2.id, elapsed / 1e3, 0.65);
    }
  }, 125);
})();
